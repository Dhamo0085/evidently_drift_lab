[pytest]
pythonpath = Data_Monitoring/Evidently_AI
testpaths = Data_Monitoring/Evidently_AI/tests
addopts = -ra
markers =
    network: downloads the Adult dataset from OpenML on first run (cached afterwards)
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
    ignore::RuntimeWarning
